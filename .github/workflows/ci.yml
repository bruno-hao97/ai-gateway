name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Gateway client tests
        run: npm run client:test

      - name: Portal theme unit tests
        run: npm run theme:test

      - name: Usage aggregate cache tests
        run: npm run test:aggregate

      - name: Observability store tests
        run: npm run test:observability

      - name: BYOK production guard tests
        run: npm run test:byok

      - name: Gommo language helper tests
        run: npm run test:gommoLanguage
