<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Gateway — Playground</title>
  <script>
    (function () {
      var docs = localStorage.getItem('portal_docs_url')
        || (location.port === '5173' ? location.origin : '');
      if (docs) {
        location.replace(docs.replace(/\/$/, '') + '/app/playground/');
      } else {
        location.replace('playground.html');
      }
    })();
  </script>
</head>
<body>
  <p><a href="/app/playground/">Open Playground</a></p>
</body>
</html>
